name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools compile
        run: python -m py_compile tools/*.py
      - name: Relative links resolve
        run: python tools/check_links.py
      - name: Tools run
        run: |
          python tools/decision_cost.py --scores 5 5 3 4
